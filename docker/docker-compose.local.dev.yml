services:
  staff-info-app:
    image: pifsc/staff-info-app:latest
    ports:
      - "0.0.0.0:5006:80"
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "1"
    environment:
      DB_HOST: ${DB_HOST}
      DB_SERVICE_NAME: ${DB_SERVICE_NAME}
    volumes:
      - "/tmp/staff-info-app/docker/src/frontend:/var/www/html"
      - "/tmp/staff-info-app/docker/src/backend:/usr/src/app"