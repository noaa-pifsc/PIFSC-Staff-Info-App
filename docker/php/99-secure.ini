; Prevent PHP errors from being shown in the browser
display_errors = Off

; Enables PHP error logging and report all errors except for notices and strict standards
log_errors = On

; Log to STDERR to docker collects them
error_log = /proc/self/fd/2

; Set error reporting level to report all errors except notices and strict standards
error_reporting = E_ALL & ~E_NOTICE & ~E_STRICT

; Do not send X-Powered-By:PHP/n.n.n response headers, so that no sensitive information about PHP configurations or errors leaks into HTTP headers
expose_php = Off

; Disable file uploads, to prevent potential abuse
file_uploads = Off

; Disable dangerous PHP functions, which can be used for malicious purposes
disable_functions = exec, shell_exec, system, passthru, popen, proc_open, curl_exec, curl_multi_exec, parse_ini_file, show_source

; Disable Allow URL Fopen, to prevent remote file inclusion attacks
allow_url_fopen = Off
allow_url_include = Off

; Enable secure session handling, to prevent session fixation and hijacking attacks.
session.cookie_secure = On
session.cookie_httponly = On
session.use_strict_mode = On
session.use_only_cookies = On

; Restrict PHP file access to certain directories
open_basedir = /var/www/html:/tmp:/var/lib/php/sessions:/usr/src/library

; Set session and upload tmp dir (ensure proper permissions)
session.save_path = /var/lib/php/sessions
upload_tmp_dir = /tmp

; Limit execution time, to prevent DoS attacks using long-running scripts
max_execution_time = 30
max_input_time = 30

; Limit memory usage, to prevent memory exhaustion attacks
memory_limit = 128M

