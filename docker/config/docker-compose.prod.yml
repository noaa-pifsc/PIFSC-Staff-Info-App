version: '2'
services:
  staff-directory:
    build:
      context: .
    image: noaa/staff-directory:latest
    container_name: staff-directory
    restart: always
    ports:
      - "127.0.0.1:5004:80"
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "1"