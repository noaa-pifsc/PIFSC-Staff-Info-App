services:
  staff-directory-dev:
    build:
      context: .
    image: noaa/staff-directory-dev:latest
    container_name: staff-directory-dev
    restart: always
    ports:
      - "0.0.0.0:5006:80"
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "1"