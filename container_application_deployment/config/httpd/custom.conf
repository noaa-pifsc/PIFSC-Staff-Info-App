# Configure Apache to only send server header "Server: Apache"
ServerTokens Prod

# Match if X-Forwarded-Host contains "apps-pifsc.fisheries.noaa.gov"
SetEnvIf X-Forwarded-Host "apps-pifsc.fisheries.noaa.gov" IS_PROXY

Header always set X-Content-Type-Options "nosniff" env=!IS_PROXY
Header always set X-Frame-Options "DENY"
Header always set X-XSS-Protection "1; mode=block"
Header always set Content-Security-Policy " \
  frame-ancestors 'none'; \
  default-src 'self'; \
  script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.gstatic.com https://dap.digitalgov.gov https://www.googletagmanager.com; \
  connect-src 'self' https://www.google-analytics.com; \
  style-src 'self' 'unsafe-inline'; \
  img-src 'self' data:; \
"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
Header always set Cross-Origin-Opener-Policy "same-origin"
Header always set Permissions-Policy "geolocation=(),midi=(),sync-xhr=(),microphone=(),camera=(),magnetometer=(),gyroscope=(),fullscreen=(self),payment=()" env=!IS_PROXY
Header edit Set-Cookie ^(.*)$ $1;HttpOnly;Secure;SameSite=Strict

# Disable HTTP TRACE, which is often used for cross-site tracing attacks
TraceEnable Off

<Directory "/var/www/html">
   Options FollowSymLinks
    AllowOverride None
    Require all granted   
</Directory>

<IfModule dir_module>
    DirectoryIndex staff-directory.php
</IfModule>
