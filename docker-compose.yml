version: '2'
services:
  staff-directory:
    build:
      context: .
    image: noaa/noaa-staff-directory:latest
    container_name: staff-directory
    restart: always
    ports:
      - "8443:443"
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "1"
